<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考試時程表</title>
  
  <!-- Google Fonts: M PLUS Rounded 1c & Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-teal: #80C5B5;
      --bg-teal-light: #94DACD;
      --sunny-yellow: #FFD84C;
      --coral-red: #FF5964;
      --warm-orange: #FFA053;
      --cream-white: #FFFDF9;
      --soft-cream: #FAF3E0;
      --deep-navy: #1C2A39;
      --blush-pink: #FF85A1;
      --soft-green: #6BCB77;
    }

    body {
      font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
      background-color: var(--bg-teal);
      color: var(--deep-navy);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--warm-orange); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--coral-red); }

    /* Custom animations & shadows */
    .pop-card {
      background: var(--cream-white);
      border: 4px solid var(--deep-navy);
      box-shadow: 6px 6px 0px var(--deep-navy);
      border-radius: 2rem;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pop-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 8px 10px 0px var(--deep-navy);
    }

    .pop-card-active {
      background: #FFFDF0;
      border: 5px solid var(--deep-navy);
      box-shadow: 8px 8px 0px var(--sunny-yellow), 8px 8px 0px 4px var(--deep-navy);
      border-radius: 2.2rem;
      animation: gentle-bounce 3s infinite ease-in-out;
    }

    .pop-button {
      border: 3px solid var(--deep-navy);
      box-shadow: 3px 3px 0px var(--deep-navy);
      border-radius: 9999px;
      transition: all 0.15s ease;
      font-weight: 800;
    }

    .pop-button:hover {
      transform: translateY(-2px);
      box-shadow: 5px 5px 0px var(--deep-navy);
    }

    .pop-button:active {
      transform: translateY(2px);
      box-shadow: 1px 1px 0px var(--deep-navy);
    }

    .pop-input {
      background: #F5EFE6;
      border: 3px solid var(--deep-navy);
      border-radius: 1.2rem;
      color: var(--deep-navy);
      font-weight: 700;
      transition: all 0.2s;
    }

    .pop-input:focus {
      outline: none;
      background: #FFFFFF;
      box-shadow: 0 0 0 4px rgba(255, 216, 76, 0.6);
      border-color: var(--deep-navy);
    }

    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0) scale(1.03); }
      50% { transform: translateY(-6px) scale(1.03); }
    }

    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .floating-decor {
      animation: float-slow 4s ease-in-out infinite;
    }

    .font-time {
      font-family: 'Fredoka', 'M PLUS Rounded 1c', sans-serif;
    }
  </style>
</head>
<body class="antialiased overflow-hidden h-screen flex flex-col relative select-none">

  <!-- 依據附件圖片繪製的背景裝飾塗鴉點綴 (SVG Layer) -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    
    <!-- 1. 左上方：太陽花 & 橘色笑臉 -->
    <svg class="absolute -top-10 -left-10 w-48 h-48 md:w-64 md:h-64 floating-decor" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 太陽花花瓣 -->
      <path d="M40 90C10 80 10 40 40 30C70 20 80 0 100 0C120 0 130 20 160 30C190 40 190 80 160 90C190 100 190 140 160 150C130 160 120 180 100 180C80 180 70 160 40 150C10 140 10 100 40 90Z" fill="#FFD84C"/>
      <!-- 花芯 -->
      <circle cx="95" cy="85" r="45" fill="#FF5964"/>
      <!-- 橘色笑臉角色 -->
      <ellipse cx="140" cy="40" rx="60" ry="50" fill="#FFA053"/>
      <!-- 笑臉眼睛與嘴巴 -->
      <circle cx="120" cy="30" r="4" fill="#1C2A39"/>
      <circle cx="150" cy="25" r="4" fill="#1C2A39"/>
      <path d="M130 45 Q138 58 148 45" stroke="#1C2A39" stroke-width="4" stroke-linecap="round" fill="none"/>
      <rect x="133" y="32" width="10" height="12" rx="4" fill="#1C2A39"/>
    </svg>

    <!-- 2. 右上方：黃色太陽花、水滴與黃心 -->
    <svg class="absolute -top-8 -right-8 w-56 h-56 md:w-72 md:h-72 floating-decor" style="animation-delay: -1s;" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 白水滴 -->
      <path d="M40 30 Q35 10 20 25 Q10 40 30 45 Z" fill="#FFFDF9" opacity="0.9"/>
      <path d="M60 45 Q55 25 40 40 Q30 55 50 60 Z" fill="#FFFDF9" opacity="0.9"/>
      <!-- 大黃花瓣 -->
      <path d="M120 20 C100 0 160 -20 180 20 C200 0 230 40 210 70 C230 100 190 140 170 110 C150 130 110 100 120 70 Z" fill="#FFD84C"/>
      <circle cx="180" cy="55" r="28" fill="#FF5964"/>
      <!-- 飄落的黃色愛心 -->
      <path d="M190 140 C190 130 175 130 175 142 C175 155 190 165 190 165 C190 165 205 155 205 142 C205 130 190 130 190 140 Z" fill="#FFD84C"/>
    </svg>

    <!-- 3. 左下角：黃色菱形笑臉角色與紅色火苗/葉子 -->
    <svg class="absolute -bottom-10 -left-10 w-52 h-52 md:w-64 md:h-64 floating-decor" style="animation-delay: -2s;" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 黃色角角角色 -->
      <path d="M-10 120 L100 70 L140 180 L-10 210 Z" fill="#FFD84C"/>
      <!-- 眼睛鼻嘴 -->
      <circle cx="40" cy="120" r="5" fill="#1C2A39"/>
      <circle cx="85" cy="100" r="5" fill="#1C2A39"/>
      <rect x="56" y="112" width="12" height="16" rx="5" fill="#1C2A39"/>
      <path d="M50 138 Q70 155 90 130" stroke="#1C2A39" stroke-width="5" stroke-linecap="round" fill="none"/>
      <!-- 紅色葉子植物 -->
      <path d="M100 190 Q120 120 140 190 Q160 120 175 190 Q190 140 210 200 Z" fill="#FF5964"/>
      <!-- 飄浮的小粉紅愛心 -->
      <path d="M25 60 C25 50 10 50 10 60 C10 72 25 82 25 82 C25 82 40 72 40 60 C40 50 25 50 25 60 Z" fill="#FF5964"/>
      <path d="M40 90 C40 82 28 82 28 90 C28 98 40 106 40 106 C40 106 52 98 52 90 C52 82 40 82 40 90 Z" fill="#FF5964"/>
    </svg>

    <!-- 4. 右下角：紅色圓圓笑臉巨星 & 白色水滴 -->
    <svg class="absolute -bottom-12 -right-12 w-64 h-64 md:w-80 md:h-80 floating-decor" style="animation-delay: -1.5s;" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- 大紅圓球 -->
      <circle cx="160" cy="160" r="110" fill="#FF5964"/>
      <!-- 眼睛鼻嘴 -->
      <circle cx="110" cy="120" r="6" fill="#1C2A39"/>
      <circle cx="175" cy="100" r="6" fill="#1C2A39"/>
      <rect x="135" y="110" width="15" height="20" rx="6" fill="#1C2A39"/>
      <path d="M135 145 Q160 170 180 128" stroke="#1C2A39" stroke-width="6" stroke-linecap="round" fill="none"/>
      <!-- 左上方飛濺白水滴 -->
      <path d="M75 125 Q60 100 70 145 Q85 155 75 125 Z" fill="#FFFDF9"/>
      <path d="M45 150 Q20 135 30 170 Q55 175 45 150 Z" fill="#FFFDF9"/>
    </svg>

    <!-- 5. 正上方中間：可愛白色綿羊雲朵 -->
    <svg class="absolute top-0 left-1/2 -translate-x-1/2 w-48 h-16 md:w-64 md:h-20" viewBox="0 0 200 60" fill="none">
      <path d="M20 60 C0 60 0 30 30 30 C30 10 70 0 100 15 C130 0 170 10 170 30 C200 30 200 60 180 60 Z" fill="#FFFDF9"/>
    </svg>
  </div>

  <!-- 頂部設定按鈕 (浮動右上方，繽紛可愛) -->
  <button onclick="openSettings()" class="absolute top-4 right-4 md:top-6 md:right-6 p-3 md:p-4 bg-[var(--sunny-yellow)] text-[var(--deep-navy)] border-4 border-[var(--deep-navy)] shadow-[4px_4px_0px_#1C2A39] rounded-full hover:scale-110 active:scale-95 transition-all duration-200 z-30 flex items-center justify-center cursor-pointer group" title="考程管理與設定">
    <i class="ph-bold ph-gear-six text-2xl md:text-3xl group-hover:rotate-90 transition-transform duration-300"></i>
  </button>

  <!-- 主內容容器 -->
  <div class="flex-1 w-full flex flex-col min-h-0 overflow-hidden relative z-10">
    
    <!-- 上方：巨大可愛時鐘與老師叮嚀 -->
    <div class="w-full flex flex-col justify-center items-center pt-6 md:pt-8 pb-2 shrink-0">
      
      <!-- 巨大可愛時鐘 -->
      <div id="clock-display" class="font-time font-extrabold tracking-wider tabular-nums text-center text-[var(--cream-white)] drop-shadow-[0_6px_0px_#1C2A39]" style="font-size: clamp(4.5rem, 18vh, 18rem); line-height: 1;">
        --:--:--
      </div>

      <!-- 老師的小叮嚀 (卡片樣式) -->
      <div id="notes-container" class="mt-3 md:mt-4 px-6 py-2 md:py-3 bg-[var(--sunny-yellow)] text-[var(--deep-navy)] border-4 border-[var(--deep-navy)] shadow-[5px_5px_0px_#1C2A39] rounded-full text-lg md:text-2xl font-black tracking-wider text-center max-w-4xl mx-4 flex items-center gap-2 md:gap-3 transition-all transform hover:scale-105">
        <i class="ph-fill ph-sparkle text-xl md:text-2xl text-[var(--coral-red)]"></i>
        <span id="notes-display">--</span>
        <i class="ph-fill ph-sparkle text-xl md:text-2xl text-[var(--coral-red)]"></i>
      </div>
    </div>

    <!-- 下方/中央：考試科目清單區塊 -->
    <div class="w-full max-w-[1500px] mx-auto px-4 md:px-8 pb-10 md:pb-12 pt-4 flex-1 flex flex-col justify-center items-center min-h-0">
      <div id="schedule-container" class="flex flex-row flex-wrap justify-center items-center content-center gap-4 md:gap-6 w-full h-full overflow-y-auto py-2">
        <!-- 內容由 JavaScript 動態生成 -->
      </div>
    </div>
  </div>

  <!-- 右下方：倒數計時器 (可愛卡片風格) -->
  <div id="countdown-container" class="fixed bottom-6 md:bottom-8 right-4 md:right-8 z-30 hidden transition-all duration-500 pop-card p-4 md:p-5 bg-[var(--soft-cream)] border-4 border-[var(--deep-navy)] shadow-[6px_6px_0px_#1C2A39]">
    <div class="text-[var(--coral-red)] text-xs md:text-sm font-black tracking-widest mb-1 flex items-center gap-2">
      <i class="ph-fill ph-timer text-lg animate-spin"></i> 本節剩餘時間
    </div>
    <div id="countdown-display" class="font-time text-4xl md:text-6xl text-[var(--deep-navy)] tabular-nums text-center font-black tracking-wider leading-none">
      --:--
    </div>
  </div>

  <!-- 設定對話視窗 (Modal) -->
  <div id="settings-modal" class="fixed inset-0 bg-[#1C2A39]/60 backdrop-blur-sm justify-center items-center z-50 p-4 hidden transition-opacity duration-300">
    <div class="w-full max-w-4xl flex flex-col overflow-hidden max-h-[90vh] bg-[var(--cream-white)] border-8 border-[var(--deep-navy)] shadow-[12px_12px_0px_#1C2A39] rounded-[2.5rem] relative">
        
        <!-- Modal Header -->
        <div class="p-4 md:p-6 flex justify-between items-center shrink-0 border-b-4 border-[var(--deep-navy)] bg-[var(--sunny-yellow)]">
          <h3 class="text-xl md:text-3xl font-black flex items-center gap-3 tracking-wider text-[var(--deep-navy)]">
            <i class="ph-bold ph-note-pencil text-3xl md:text-4xl"></i> 考試時程與廣播設定
          </h3>
          <button onclick="closeSettings()" class="pop-button p-2 bg-[var(--coral-red)] text-white hover:bg-red-500 transition-colors">
            <i class="ph-bold ph-x text-xl md:text-2xl"></i>
          </button>
        </div>

        <!-- Modal Content -->
        <div class="p-4 md:p-8 overflow-y-auto flex-1 flex flex-col md:flex-row gap-6 md:gap-8 min-h-0 bg-[#FFFDF9]">
          
          <!-- 左欄：全局設定 -->
          <div class="w-full md:w-5/12 flex flex-col gap-6">
            <div class="p-5 md:p-6 rounded-2xl border-4 border-[var(--deep-navy)] bg-[var(--soft-cream)] shadow-[4px_4px_0px_#1C2A39]">
              <h4 class="text-lg md:text-xl font-black text-[var(--deep-navy)] tracking-wider mb-4 md:mb-6 flex items-center gap-2 border-b-4 border-[var(--deep-navy)] pb-2">
                <i class="ph-bold ph-sliders text-2xl text-[var(--warm-orange)]"></i> 顯示風格設定
              </h4>
              
              <div class="space-y-4 md:space-y-6">
                <label class="flex items-center gap-3 cursor-pointer group">
                  <input type="checkbox" id="setting-countdown" onchange="autoSaveGlobalSettings()" class="w-6 h-6 rounded-lg border-3 border-[var(--deep-navy)] text-[var(--warm-orange)] focus:ring-[var(--sunny-yellow)] cursor-pointer">
                  <span class="text-base md:text-lg font-bold text-[var(--deep-navy)] tracking-wider group-hover:text-[var(--warm-orange)] transition-colors">顯示右下角剩餘計時器</span>
                </label>

                <div class="pt-2">
                  <label class="block text-base md:text-lg font-black text-[var(--deep-navy)] mb-2 tracking-wider flex items-center gap-2">
                    <i class="ph-bold ph-chat-teardrop-dots text-2xl text-[var(--coral-red)]"></i> 老師的小叮嚀
                  </label>
                  <textarea id="setting-notes" rows="3" onchange="autoSaveGlobalSettings()" placeholder="例如：加油！寫完記得多檢查兩遍喔！" class="w-full p-3 md:p-4 pop-input text-base md:text-lg resize-none"></textarea>
                </div>
              </div>
            </div>
          </div>

          <!-- 右欄：考程編輯 -->
          <div class="w-full md:w-7/12 flex flex-col">
            <h4 class="text-lg md:text-xl font-black text-[var(--deep-navy)] tracking-wider mb-3 flex items-center gap-2">
              <i class="ph-bold ph-list-plus text-2xl text-[var(--coral-red)]"></i> 新增或修改考程
            </h4>
            
            <div class="p-4 md:p-5 rounded-2xl border-4 border-[var(--deep-navy)] bg-[#FAF3E0] mb-4 md:mb-6 grid grid-cols-2 md:flex md:flex-wrap gap-3 items-end shadow-[4px_4px_0px_#1C2A39]">
              <div class="col-span-2 md:flex-1 md:min-w-[110px]">
                <label class="block text-xs md:text-sm font-black text-[var(--deep-navy)] mb-1 tracking-wider">科目名稱</label>
                <input type="text" id="new-subject" placeholder="例：國文" class="w-full p-2.5 pop-input text-base" />
              </div>
              <div class="col-span-1 md:w-32">
                <label class="block text-xs md:text-sm font-black text-[var(--deep-navy)] mb-1 tracking-wider">開始時間</label>
                <input type="time" id="new-start" class="w-full p-2.5 pop-input text-base" />
              </div>
              <div class="col-span-1 md:w-32">
                <label class="block text-xs md:text-sm font-black text-[var(--deep-navy)] mb-1 tracking-wider">結束時間</label>
                <input type="time" id="new-end" class="w-full p-2.5 pop-input text-base" />
              </div>
              <button id="btn-submit-item" type="button" onclick="addEditingItem()" class="col-span-2 pop-button bg-[var(--soft-green)] text-[var(--deep-navy)] px-5 py-2.5 flex items-center gap-1 font-extrabold transition-all w-full md:w-auto justify-center tracking-wider text-base cursor-pointer">
                <i id="submit-icon" class="ph-bold ph-plus text-xl"></i> <span id="submit-text">新增項目</span>
              </button>
            </div>

            <div id="editing-list" class="space-y-2 md:space-y-3 overflow-y-auto max-h-[30vh] pr-2">
              <!-- 動態生成考程列表 -->
            </div>
          </div>
        </div>

        <!-- Modal Footer -->
        <div class="p-4 md:p-5 flex justify-end gap-4 shrink-0 border-t-4 border-[var(--deep-navy)] bg-[var(--soft-cream)]">
          <button onclick="closeSettings()" class="pop-button px-6 py-2.5 md:py-3 bg-[var(--sunny-yellow)] text-[var(--deep-navy)] hover:bg-[var(--warm-orange)] transition-colors tracking-wider text-base md:text-lg cursor-pointer">
            完成並關閉
          </button>
        </div>

    </div>
  </div>

  <!-- 自訂溫馨 Confirm/Alert Modal -->
  <div id="custom-dialog" class="fixed inset-0 bg-[#1C2A39]/60 backdrop-blur-sm justify-center items-center z-50 p-4 hidden">
    <div class="w-full max-w-md bg-[var(--cream-white)] border-8 border-[var(--deep-navy)] shadow-[10px_10px_0px_#1C2A39] rounded-[2rem] p-6 text-center">
      <div id="dialog-icon-container" class="w-16 h-16 bg-[var(--sunny-yellow)] border-4 border-[var(--deep-navy)] rounded-full flex items-center justify-center mx-auto mb-4">
        <i id="dialog-icon" class="ph-bold ph-info text-3xl text-[var(--deep-navy)]"></i>
      </div>
      <h3 id="dialog-title" class="text-2xl font-black text-[var(--deep-navy)] mb-2">提醒</h3>
      <p id="dialog-msg" class="text-lg font-bold text-gray-700 mb-6">確定要執行這項操作嗎？</p>
      <div id="dialog-buttons" class="flex justify-center gap-4">
        <button id="dialog-btn-cancel" class="pop-button px-5 py-2 bg-gray-200 text-gray-800 hover:bg-gray-300">取消</button>
        <button id="dialog-btn-confirm" class="pop-button px-5 py-2 bg-[var(--coral-red)] text-white hover:bg-red-500">確定</button>
      </div>
    </div>
  </div>

  <script>
    // 預設資料
    const defaultData = {
      schedule: [
        { id: '1', subject: '國文', startTime: '08:10', endTime: '09:30' },
        { id: '2', subject: '英文', startTime: '09:50', endTime: '11:10' },
        { id: '3', subject: '數學', startTime: '11:30', endTime: '12:50' },
      ],
      settings: { showCountdown: true, teacherNotes: '各位同學，考試加油！細心作答喔！' }
    };
    
    let appData = JSON.parse(JSON.stringify(defaultData));
    
    try {
      const savedData = localStorage.getItem('boardAppData');
      if (savedData) appData = JSON.parse(savedData);
    } catch (e) {
      console.error('無法讀取本地儲存資料', e);
    }
    
    let editingSchedule = [];
    let activeExamId = null;
    let currentEditId = null; 

    // 科目色彩卡片調色盤
    const cardColorPairs = [
      { bg: 'bg-[#FFFDF0]', border: 'border-[var(--deep-navy)]', accent: 'text-[var(--warm-orange)]', tagBg: 'bg-[var(--sunny-yellow)]' },
      { bg: 'bg-[#F0F9FF]', border: 'border-[var(--deep-navy)]', accent: 'text-[#0284C7]', tagBg: 'bg-[#BAE6FD]' },
      { bg: 'bg-[#FFF0F3]', border: 'border-[var(--deep-navy)]', accent: 'text-[var(--coral-red)]', tagBg: 'bg-[#FFCCD5]' },
      { bg: 'bg-[#F0FDF4]', border: 'border-[var(--deep-navy)]', accent: 'text-[#16A34A]', tagBg: 'bg-[#BBF7D0]' },
      { bg: 'bg-[#FAF5FF]', border: 'border-[var(--deep-navy)]', accent: 'text-[#9333EA]', tagBg: 'bg-[#E9D5FF]' },
    ];

    const formatTime = (date) => {
      const h = String(date.getHours()).padStart(2, '0');
      const m = String(date.getMinutes()).padStart(2, '0');
      const s = String(date.getSeconds()).padStart(2, '0');
      return `${h}:${m}:${s}`;
    };

    const isCurrentExam = (start, end, timeObj) => {
      const currentMinutes = timeObj.getHours() * 60 + timeObj.getMinutes();
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      const startTotal = startH * 60 + startM;
      const endTotal = endH * 60 + endM;
      return currentMinutes >= startTotal && currentMinutes <= endTotal;
    };

    // 自訂溫馨訊息框 (取代原生 alert / confirm)
    function showCuteDialog({ title, message, isConfirm = false, onConfirm }) {
      const dialog = document.getElementById('custom-dialog');
      const titleEl = document.getElementById('dialog-title');
      const msgEl = document.getElementById('dialog-msg');
      const cancelBtn = document.getElementById('dialog-btn-cancel');
      const confirmBtn = document.getElementById('dialog-btn-confirm');

      titleEl.textContent = title || '提醒';
      msgEl.textContent = message || '';

      if (isConfirm) {
        cancelBtn.classList.remove('hidden');
        confirmBtn.textContent = '確定';
      } else {
        cancelBtn.classList.add('hidden');
        confirmBtn.textContent = '我知道了';
      }

      const closeDialog = () => {
        dialog.classList.add('hidden');
        dialog.classList.remove('flex');
      };

      confirmBtn.onclick = () => {
        closeDialog();
        if (onConfirm) onConfirm();
      };

      cancelBtn.onclick = closeDialog;

      dialog.classList.remove('hidden');
      dialog.classList.add('flex');
    }

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      
      if (appData.schedule.length === 0) {
        container.innerHTML = `
          <div class="text-center bg-[var(--cream-white)] border-4 border-[var(--deep-navy)] p-8 rounded-3xl shadow-[6px_6px_0px_#1C2A39] mt-6 max-w-md mx-auto">
            <i class="ph-bold ph-smiley-blank text-6xl text-[var(--warm-orange)] mb-3 inline-block animate-bounce"></i>
            <p class="text-xl font-extrabold text-[var(--deep-navy)] tracking-wider">考程表空空如也～</p>
            <p class="text-sm font-bold text-gray-500 mt-1">請點擊右上角齒輪新增考試科目喔！</p>
          </div>
        `;
        return;
      }

      container.innerHTML = appData.schedule.map((exam, idx) => {
        const isActive = exam.id === activeExamId;
        const styleTheme = cardColorPairs[idx % cardColorPairs.length];

        return `
          <div class="p-5 md:p-6 transition-all duration-300 relative ${isActive ? 'pop-card-active z-20 scale-105' : 'pop-card ' + styleTheme.bg} w-fit min-w-[240px] md:min-w-[280px] flex-shrink-0 group">
            
            ${isActive ? `
              <span class="absolute -top-4 -left-3 bg-[var(--coral-red)] text-white border-3 border-[var(--deep-navy)] text-xs md:text-sm font-black px-3 py-1 tracking-wider rounded-full shadow-[3px_3px_0px_#1C2A39] flex items-center gap-1.5 animate-pulse z-30">
                <i class="ph-fill ph-fire text-yellow-300"></i> 進行中
              </span>
            ` : ''}

            <div class="flex flex-col gap-3 h-full justify-center">
              
              <!-- 科目名稱與操作按鈕 -->
              <div class="flex items-center justify-between gap-3 border-b-3 border-[var(--deep-navy)]/20 pb-3">
                <div class="flex items-center gap-2">
                  <span class="w-3 h-8 bg-[var(--warm-orange)] rounded-full border-2 border-[var(--deep-navy)]"></span>
                  <span class="text-3xl md:text-4xl font-black tracking-wider text-[var(--deep-navy)]">
                    ${exam.subject}
                  </span>
                </div>
                
                <div class="flex gap-1">
                  <button onclick="editFromMain('${exam.id}')" class="p-1.5 rounded-full bg-white border-2 border-[var(--deep-navy)] text-[var(--deep-navy)] hover:bg-[var(--sunny-yellow)] transition-all shadow-[2px_2px_0px_#1C2A39] cursor-pointer" title="修改">
                    <i class="ph-bold ph-pencil-simple text-lg md:text-xl"></i>
                  </button>
                  <button onclick="deleteFromMain('${exam.id}')" class="p-1.5 rounded-full bg-white border-2 border-[var(--deep-navy)] text-[var(--deep-navy)] hover:bg-[var(--coral-red)] hover:text-white transition-all shadow-[2px_2px_0px_#1C2A39] cursor-pointer" title="刪除">
                    <i class="ph-bold ph-trash text-lg md:text-xl"></i>
                  </button>
                </div>
              </div>
              
              <!-- 下方時間區塊 -->
              <div class="flex items-center gap-3 mt-1">
                <div class="p-2.5 rounded-2xl bg-[var(--sunny-yellow)] border-2 border-[var(--deep-navy)] shadow-[2px_2px_0px_#1C2A39]">
                  <i class="ph-bold ${isActive ? 'ph-hourglass text-[var(--coral-red)] animate-spin' : 'ph-clock text-[var(--deep-navy)]'} text-2xl md:text-3xl"></i>
                </div>
                <div class="flex flex-col font-time">
                  <span class="text-xl md:text-2xl font-black text-[var(--deep-navy)] leading-tight tracking-wider">${exam.startTime}</span>
                  <span class="text-xs font-black text-gray-400 text-center -my-1">▼</span>
                  <span class="text-xl md:text-2xl font-black text-[var(--deep-navy)] leading-tight tracking-wider">${exam.endTime}</span>
                </div>
              </div>
              
            </div>
          </div>
        `;
      }).join('');
    }

    function renderEditingSchedule() {
      const listContainer = document.getElementById('editing-list');
      
      if (editingSchedule.length === 0) {
        listContainer.innerHTML = `<p class="text-center text-gray-400 font-bold py-4 tracking-wider">目前沒有考程項目喔！</p>`;
        return;
      }

      listContainer.innerHTML = editingSchedule.map(item => `
        <div class="flex justify-between items-center p-3 rounded-2xl border-3 border-[var(--deep-navy)] bg-white shadow-[3px_3px_0px_#1C2A39]">
          <div class="flex items-center gap-3 flex-wrap">
            <span class="text-lg md:text-xl font-black text-[var(--deep-navy)] tracking-wider px-3 py-0.5 bg-[var(--sunny-yellow)] border-2 border-[var(--deep-navy)] rounded-full">${item.subject}</span>
            <span class="font-time font-bold text-base md:text-lg text-gray-700 tracking-wider">
              ${item.startTime} - ${item.endTime}
            </span>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="editEditingItem('${item.id}')" class="p-1.5 rounded-lg bg-[var(--soft-cream)] border-2 border-[var(--deep-navy)] text-[var(--deep-navy)] hover:bg-[var(--warm-orange)] transition-colors cursor-pointer">
              <i class="ph-bold ph-pencil-simple text-xl"></i>
            </button>
            <button onclick="removeEditingItem('${item.id}')" class="p-1.5 rounded-lg bg-[var(--soft-cream)] border-2 border-[var(--deep-navy)] text-[var(--coral-red)] hover:bg-[var(--coral-red)] hover:text-white transition-colors cursor-pointer">
              <i class="ph-bold ph-trash text-xl"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderNotes() {
      const notes = appData.settings.teacherNotes;
      const display = document.getElementById('notes-display');
      const container = document.getElementById('notes-container');
      display.textContent = notes;
      container.style.display = notes ? 'flex' : 'none';
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock-display').textContent = formatTime(now);

      let newActiveExam = null;
      for (const exam of appData.schedule) {
        if (isCurrentExam(exam.startTime, exam.endTime, now)) {
          newActiveExam = exam;
          break;
        }
      }

      if ((newActiveExam ? newActiveExam.id : null) !== activeExamId) {
        activeExamId = newActiveExam ? newActiveExam.id : null;
        renderSchedule();
      }

      const countdownContainer = document.getElementById('countdown-container');
      if (appData.settings.showCountdown && newActiveExam) {
        countdownContainer.classList.remove('translate-y-[150%]', 'opacity-0', 'hidden');
        countdownContainer.classList.add('translate-y-0', 'opacity-100');
        
        const [endH, endM] = newActiveExam.endTime.split(':').map(Number);
        const endDate = new Date();
        endDate.setHours(endH, endM, 0, 0);
        
        let diffSeconds = Math.floor((endDate - now) / 1000);
        if (diffSeconds < 0) diffSeconds = 0; 
        
        const m = String(Math.floor(diffSeconds / 60)).padStart(2, '0');
        const s = String(diffSeconds % 60).padStart(2, '0');
        document.getElementById('countdown-display').textContent = `${m}:${s}`;
      } else {
        countdownContainer.classList.remove('translate-y-0', 'opacity-100');
        countdownContainer.classList.add('translate-y-[150%]', 'opacity-0');
        setTimeout(() => {
          if (!appData.settings.showCountdown || !newActiveExam) countdownContainer.classList.add('hidden');
        }, 500); 
      }
    }

    function autoSaveGlobalSettings() {
      appData.settings.showCountdown = document.getElementById('setting-countdown').checked;
      appData.settings.teacherNotes = document.getElementById('setting-notes').value.trim();
      syncToMainBoard();
    }

    function syncToMainBoard() {
      try { localStorage.setItem('boardAppData', JSON.stringify(appData)); } catch (e) {}
      renderNotes();
      renderSchedule();
      updateClock();
    }

    function openSettings() {
      editingSchedule = JSON.parse(JSON.stringify(appData.schedule)); 
      document.getElementById('setting-countdown').checked = appData.settings.showCountdown;
      document.getElementById('setting-notes').value = appData.settings.teacherNotes;
      
      const modal = document.getElementById('settings-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      renderEditingSchedule();
    }

    function closeSettings() {
      const modal = document.getElementById('settings-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      resetInputFields();
    }

    function editFromMain(id) {
      openSettings();
      editEditingItem(id);
    }

    function deleteFromMain(id) {
      showCuteDialog({
        title: '確定刪除？',
        message: '確定要移除這個考試科目嗎？',
        isConfirm: true,
        onConfirm: () => {
          appData.schedule = appData.schedule.filter(item => item.id !== id);
          activeExamId = null; 
          syncToMainBoard();
        }
      });
    }

    function resetInputFields() {
      document.getElementById('new-subject').value = '';
      document.getElementById('new-start').value = '';
      document.getElementById('new-end').value = '';
      
      currentEditId = null;
      const btn = document.getElementById('btn-submit-item');
      document.getElementById('submit-text').textContent = '新增項目';
      document.getElementById('submit-icon').className = 'ph-bold ph-plus text-xl';
      btn.className = "col-span-2 pop-button bg-[var(--soft-green)] text-[var(--deep-navy)] px-5 py-2.5 flex items-center gap-1 font-extrabold transition-all w-full md:w-auto justify-center tracking-wider text-base cursor-pointer";
    }

    function addEditingItem() {
      const subjectInput = document.getElementById('new-subject');
      const startInput = document.getElementById('new-start');
      const endInput = document.getElementById('new-end');

      const subject = subjectInput.value.trim();
      const startTime = startInput.value;
      const endTime = endInput.value;

      if (subject && startTime && endTime) {
        if(startTime >= endTime) {
          showCuteDialog({ title: '時間設定錯誤', message: '結束時間必須晚於開始時間喔！' });
          return;
        }

        if (currentEditId) {
          const index = editingSchedule.findIndex(item => item.id === currentEditId);
          if (index !== -1) {
            editingSchedule[index] = { ...editingSchedule[index], subject, startTime, endTime };
          }
        } else {
          editingSchedule.push({
            id: Date.now().toString(),
            subject,
            startTime,
            endTime
          });
        }

        editingSchedule.sort((a, b) => a.startTime.localeCompare(b.startTime));
        
        appData.schedule = [...editingSchedule];
        syncToMainBoard();
        
        renderEditingSchedule();
        resetInputFields(); 

        const btn = document.getElementById('btn-submit-item');
        document.getElementById('submit-text').textContent = '成功儲存！';
        btn.classList.add('bg-[var(--sunny-yellow)]');
        setTimeout(() => {
          document.getElementById('submit-text').textContent = '新增項目';
          btn.classList.remove('bg-[var(--sunny-yellow)]');
        }, 1200);

      } else {
        showCuteDialog({ title: '欄位未填滿', message: '請把科目名稱與時間都填寫完整喔！' });
      }
    }

    function editEditingItem(id) {
      const item = editingSchedule.find(i => i.id === id);
      if (item) {
        document.getElementById('new-subject').value = item.subject;
        document.getElementById('new-start').value = item.startTime;
        document.getElementById('new-end').value = item.endTime;
        currentEditId = id;
        
        const btn = document.getElementById('btn-submit-item');
        document.getElementById('submit-text').textContent = '更新項目';
        document.getElementById('submit-icon').className = 'ph-bold ph-check text-xl';
        btn.className = "col-span-2 pop-button bg-[var(--sunny-yellow)] text-[var(--deep-navy)] px-5 py-2.5 flex items-center gap-1 font-extrabold transition-all w-full md:w-auto justify-center tracking-wider text-base cursor-pointer";
      }
    }

    function removeEditingItem(id) {
      editingSchedule = editingSchedule.filter(item => item.id !== id);
      if (currentEditId === id) resetInputFields();
      
      appData.schedule = [...editingSchedule];
      syncToMainBoard();
      
      renderEditingSchedule();
    }

    function init() {
      renderNotes();
      renderSchedule(); 
      updateClock();    
      setInterval(updateClock, 1000);
    }

    window.addEventListener('DOMContentLoaded', init);

  </script>
</body>
</html>
